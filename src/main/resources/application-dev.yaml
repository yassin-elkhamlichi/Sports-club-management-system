spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:  jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  webSiteUrlDev: "http://localhost:8080"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}
app:
  jwt:
    secret: ${JWT_SECRET}
    tokenAccessExpirationTime: ${JWT_ACCESS_EXPIRATION}
    tokenRefreshExpirationTime: ${JWT_REFRESH_EXPIRATION}


