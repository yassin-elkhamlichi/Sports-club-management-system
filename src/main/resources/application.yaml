spring:
  application:
    name: sport_club_projet
  
  profiles:
    active: dev

  jpa:
    show-sql: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  flyway:
    enabled: true

  security:
    oauth2:
        client:
          registration:
            google:
              client-id: ${CLIENT_ID}
              client-secret: ${CLIENT_SECRET}


