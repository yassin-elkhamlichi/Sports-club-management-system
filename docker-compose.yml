services:
  mysql:
    container_name: sport-club-db
    image: mysql:8.0
    ports:
      - "3370:3306"
    volumes:
      - app-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: sportClub
      MYSQL_USER: userDB
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    networks:
      - sport-club-network
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
  sport-club:
    container_name: sport-club-app
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sportClub
      SPRING_DATASOURCE_USERNAME: userDB
      APP_JWT_TOKENACCESSEXPIRATIONTIME: ${JWT_ACCESS_EXPIRATION}
      APP_JWT_TOKENREFRESHEXPIRATIONTIME: ${JWT_REFRESH_EXPIRATION}
      CLIENT_ID: 943107311454-ekqj8a5lq4kv78o5ljtnl45edeosjgpm.apps.googleusercontent.com
      SPRING_PROFILES_ACTIVE: prod
    secrets:
      - db_password
      - jwt_secret
      - CLIENT_SECRET
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sport-club-network
    restart: on-failure

secrets:
  db_root_password:
    file: run/secrets/db_root_password.txt
  jwt_secret:
    file: run/secrets/jwt_secret.txt
  db_password:
    file: run/secrets/db_password.txt
  CLIENT_SECRET:
    file: run/secrets/CLIENT_SECRET.txt

volumes:
  app-data:
    name: app-data-volume

networks:
  sport-club-network:
    driver: bridge
